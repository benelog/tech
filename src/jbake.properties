site.host=https://tech.benelog.net/
site.title=Benelog Tech Notes

site.author=benelog

# Comments: giscus (https://giscus.app) backed by GitHub Discussions.
# 1. Make the source repository public and enable Discussions.
# 2. Install the giscus app on it: https://github.com/apps/giscus
# 3. Open https://giscus.app, pick the repo and a category, then copy
#    data-repo-id / data-category-id from the generated snippet into the values below.
# Leaving site.giscus.repo empty hides the comment section.
site.giscus.repo=benelog/tech
site.giscus.repo_id=R_kgDOU5efyg
site.giscus.category=Announcements
site.giscus.category_id=DIC_kwDOU5efys4DG6eI
site.giscus.mapping=pathname
site.giscus.theme=light

# Google Analytics 4 measurement ID (G-XXXXXXXXXX). Leaving it empty disables the tag.
site.google.trackingid=G-EZCZ91W25B

#ReadTimes are displayed using https://github.com/michael-lynch/reading-time
site.includeReadTime=false

site.menus.main = archive, tags, about, rss
#To add menus, for every menuitem in site.menus.main, add three properties in below pattern
#site.menus.{menuitem}.home.label=Home
#site.menus.{menuitem}.home.url=/
#site.menus.{menuitem}.home.icon=fa fa-home

site.menus.main.archive.label=Posts
site.menus.main.archive.url=archive.html
site.menus.main.archive.icon=fa fa-archive

site.menus.main.rss.label=RSS
## change below url to feed.xml for tradional RSS Feed
site.menus.main.rss.url=feed.xml
site.menus.main.rss.icon=fa fa-rss

site.menus.main.tags.label=Tags
site.menus.main.tags.url=tags.html
site.menus.main.tags.icon=fa fa-tags

site.menus.main.about.label=About
site.menus.main.about.url=about.html
site.menus.main.about.icon=fa fa-user

#How many recent posts should be shown in sidebar
sidebar.postAmount=4
sidebar.viewMorePostLink=archive.html

sidebar.tags.show=true
sidebar.tags.show.count=true

sidebar.intro.pic.src = img/main/intro.jpg
sidebar.intro.pic.circle    = true
sidebar.intro.pic.imperfect = false
sidebar.intro.pic.width     = 150px
sidebar.intro.pic.alt       = benelog

sidebar.intro.header = Benelog Tech Notes
sidebar.intro.summary = Engineering notes by Sanghyuk Jung on Java and backend systems
sidebar.intro.about = introduce
sidebar.intro.about.learnMore=about.html

# Social links are shown when related id's are mentioned
sidebar.social.show = true
sidebar.social.github          = benelog
sidebar.social.linkedin        = sanghyukjung
sidebar.social.slideshare      = benelog
sidebar.social.facebook        = benelog
sidebar.social.twitter         =
sidebar.social.email           =

index.paginate=true
index.posts_per_page=3

output.extension=.html
uri.noExtension=false
uri.noExtension.prefix=

render.tags=true
render.sitemap=true
render.archive=true

## Commnet below two properties to generate, tradional XML RSS feed.
# feed.file=feed.json
# template.feed.file=feed-json.ftl
template.post.rootpath=/
template.alltags.file=alltags.ftl
asciidoctor.attributes.export=true
